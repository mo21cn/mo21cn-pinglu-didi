# 本地开发环境编排（MySQL + Redis + backend）
# 用法：在项目根目录执行 `docker compose -f deploy/docker-compose.yml up`
services:
  mysql:
    image: mysql:8.0
    container_name: pinglu-didi-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pinglu_didi_dev
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: pinglu-didi-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ../backend
    container_name: pinglu-didi-backend
    environment:
      APP_ENV: development
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"

volumes:
  mysql-data:
