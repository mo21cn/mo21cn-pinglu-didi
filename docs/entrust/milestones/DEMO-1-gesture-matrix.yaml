    - "找到可用路径 ⇒ 记录 input_method 与 observable_result，status = PASS"
    - "或确认限制并给出替代方案 ⇒ status = LIMITATION，且必须填 alternative_path 与 design_constraint"
  round:
    - "5 项全部有结论（PASS 或 LIMITATION 二者之一），即本项收口"
    - "收口后立即进入 S2；不得把 A / B 扩充成新的长期前置阶段"
