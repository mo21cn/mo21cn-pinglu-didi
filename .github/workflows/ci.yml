name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

jobs:
  backend:
    name: 后端 lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint（ruff）
        run: ruff check app

      - name: 类型检查（mypy，非阻塞）
        run: mypy app || true

      - name: 测试（pytest）
        env:
          APP_ENV: test
        run: pytest --cov=app --cov-report=term-missing
