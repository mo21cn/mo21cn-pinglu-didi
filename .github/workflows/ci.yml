name: CI

on:
  push:
    branches: [develop, main, "feature/**", "release/**", "hotfix/**"]
  pull_request:
    branches: [develop, main]

jobs:
  # ─────────────────────────────────────────────────────────────
  # 后端：lint + 类型检查 + 单测
  # ─────────────────────────────────────────────────────────────
  backend:
    name: 后端 lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint（ruff check）
        # scripts/ 同样在范围内：它是**CI 自己会执行的代码**（见下方 frontend-e2e
        # 里的 `python scripts/seed_demo.py`），不该比 app/tests 低一档标准。
        run: ruff check app tests scripts

      - name: 格式门禁（ruff format --check，阻塞）
        # ruff 版本已精确锁定在 requirements.txt（DR-0004），保证 CI 与本地结果一致。
        # 升级 ruff 必须走独立 PR：改版本号 + 全量重跑格式化（单独 style 提交）。
        run: ruff format --check app tests scripts

      - name: 类型检查（mypy，阻塞——my 闭环后 0 errors）
        # 有意**不含** scripts/：它们是演示/种子脚本，刻意写得松（json dict 拼装、
        # SQLAlchemy Row 直接索引），补齐 strict 注解约需 31 处改动，收益低且会稀释
        # 门禁信号。这是**显式决策**，不是漏配 —— 将来若这些脚本进入生产路径再一并纳入。
        run: mypy app migrations migrate.py

      - name: Lint（ruff check，仓库根 scripts/*.py）
        # CI 里的 `scripts` 指 backend/scripts（本 job 默认 CWD 是 backend）。
        # 仓库根的 scripts/*.py 此前**完全不在任何门禁内**：它们不在 CI 执行路径上，
        # 按 DR-0007 的标准并非「必须纳入」—— 但它们仍是随仓库演进的代码，
        # 至少在 lint / 格式这层不该裸奔（ENT-028 扩范围；mypy 仍有意排除，理由同上一步）。
        #
        # 逐个点名而非扫目录，是为了让「谁在门禁内」在 ci.yml 里一眼可见；
        # ⚠️ 新增仓库根 Python 脚本时请加进下面的名单 —— 末尾的登记检查会**失败提醒**，
        #    不会静默漏过（这正是把 verify_baseline.py 显式登记为豁免的原因）。
        working-directory: .
        run: |
          ruff check --config backend/pyproject.toml \
            scripts/verify_miniapp_devtools.py scripts/wechatide_client.py
          ruff format --check --config backend/pyproject.toml \
            scripts/verify_miniapp_devtools.py scripts/wechatide_client.py

          # 登记完整性：仓库根每个 .py 必须「已纳入 lint」或「已登记豁免」，二者必居其一。
          linted="scripts/verify_miniapp_devtools.py scripts/wechatide_client.py"
          exempt="scripts/verify_baseline.py"
          for f in scripts/*.py; do
            case " ${linted} ${exempt} " in
              *" ${f} "*) ;;
              *) echo "✗ ${f} 既未纳入 ruff 门禁、也未登记豁免；请二选一，不要静默漏过"; exit 1 ;;
            esac
          done
          echo "✓ 仓库根 scripts/*.py 登记完整（linted 2 / exempt 1）"

      - name: 测试（pytest）
        env:
          APP_ENV: test
        run: pytest --tb=short --cov=app --cov-report=term-missing

  # ─────────────────────────────────────────────────────────────
  # 数据库迁移：全新 SQLite 库上跑通迁移，并证明重复执行是幂等的
  #   MySQL 方言由下方 db-migration-mysql job 真实执行（DR-0002）。
  # ─────────────────────────────────────────────────────────────
  db-migration:
    name: 数据库迁移（SQLite 冒烟 + 幂等）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:///./migration_smoke.db
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 迁移状态（全新库，应全部待执行）
        run: python migrate.py --status

      - name: 执行迁移并校验（首次）
        run: python migrate.py --verify

      - name: 再次执行应无待执行（幂等）
        run: python migrate.py --verify

  # ─────────────────────────────────────────────────────────────
  # 数据库迁移（MySQL 真实执行，DR-0002）：
  #   证明迁移的 mysql 方言 SQL 在真实 MySQL 8.0 上可执行且幂等。
  #   范围界定：仅覆盖迁移 SQL；pytest 对接 MySQL 的并发集成测试
  #   属后续增量（见 DR-0002「范围界定」）。
  # ─────────────────────────────────────────────────────────────
  db-migration-mysql:
    name: 数据库迁移（MySQL 8.0 真实执行）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: entrust_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: test
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/entrust_test?charset=utf8mb4
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # pymysql 仅 CI 用（纯 Python，无编译依赖）；生产驱动选型不在 DR-0002 范围
          pip install pymysql

      - name: 等待 MySQL 就绪
        run: |
          for i in $(seq 1 30); do
            if python -c "import os; from sqlalchemy import create_engine, text; e = create_engine(os.environ['DATABASE_URL']); c = e.connect(); c.execute(text('SELECT 1')); c.close(); print('mysql ready')" 2>/dev/null; then exit 0; fi
            echo "waiting mysql ($i/30)"; sleep 2
          done
          echo "MySQL 60s 内未就绪"; exit 1

      - name: 迁移状态（全新库，应全部待执行）
        run: python migrate.py --status

      - name: 执行迁移并校验（首次，MySQL 方言）
        run: python migrate.py --verify

      - name: 再次执行应无待执行（幂等）
        run: python migrate.py --verify

  # ─────────────────────────────────────────────────────────────
  # pytest-MySQL 并发集成（ENT-007，DR-0002 后续）：
  #   真实 MySQL 8.0 上验证并发正确性锚点：双认领（AC-03）、
  #   乐观锁并发编辑（AC-11）、幂等并发副作用恰好一次。
  #   SQLite 结果不作为 MySQL 锁正确性的证据（计划 §7.3）。
  # ─────────────────────────────────────────────────────────────
  pytest-mysql:
    name: 并发集成（MySQL 8.0 真实执行）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: entrust_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: test
      MYSQL_TEST_URL: mysql+pymysql://root:root@127.0.0.1:3306/entrust_test?charset=utf8mb4
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pymysql

      - name: 等待 MySQL 就绪
        run: |
          for i in $(seq 1 30); do
            if python -c "import os; from sqlalchemy import create_engine, text; e = create_engine(os.environ['MYSQL_TEST_URL']); c = e.connect(); c.execute(text('SELECT 1')); c.close(); print('mysql ready')" 2>/dev/null; then exit 0; fi
            echo "waiting mysql ($i/30)"; sleep 2
          done
          echo "MySQL 60s 内未就绪"; exit 1

      - name: 并发集成测试（仅 -m mysql；其余用例由 backend job 覆盖）
        run: pytest -m mysql --tb=short -v

  # ─────────────────────────────────────────────────────────────
  # 前端静态契约：不依赖后端，秒级完成
  #   verify_miniapp       JSON 语法 / 页面四件套 / tabBar / 路由可达 / 事件函数存在性
  #   verify_ui_interactions 组件 props 与事件 / 弹层闭环 / 长列表与日期等静态防线
  #   verify_entrust_ui    委托发货：入口隔离（AC-02）/ 五态判定（AC-21）/
  #                        跨端状态取值域 / 工作台用到的 CSS 类存在性
  #   verify_tabbar_targets 动态 switchTab 目标取值域（驱动真实首页 / 自定义 tabBar 逻辑）
  # 真机走查依赖微信开发者工具，无法在 CI 运行，仍由本机执行：
  #   现行轨 → scripts/verify_miniapp_devtools.py（IDE 自带 wechatide 工具链，
  #            驱动层 scripts/wechatide_client.py）
  #   旧轨   → scripts/verify_miniapp_device.js（miniprogram-automator / ws）**已退役**：
  #            微信开发者工具 3.17.3 起不再服务该协议。文件保留作章节对照，**不执行**。
  #            未迁移章节的**覆盖缺口**登记在 DR-0009「后续增量」，不假装已覆盖。
  # ─────────────────────────────────────────────────────────────
  frontend-static:
    name: 前端静态契约（结构 / 路由 / UI 交互）
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 小程序结构 / 路由 / 事件校验
        run: node scripts/verify_miniapp.js

      - name: UI 交互契约校验
        # ENT-019 起含第 ⑨ 节：加载两个委托页的真实 JS（桩掉 wx / utils），
        # 断言入口守卫先于取数、卡片经 go() 打开详情、冷启动返回键走 reLaunch、
        # 未保存编辑只在 replace / 预算耗尽时提示。verify_routes* 只能证明
        # 「注册表对不对」，证明不了「页面有没有真的用它」。
        run: node scripts/verify_ui_interactions.js

      - name: 委托发货前端契约校验
        # 页面 onLoad/onShow 在 CI 里跑不了，故入口可见性与五态判定被抽成
        # miniapp/utils/entrust.js 的纯函数，由本脚本驱动（含跨端取值域交叉断言）。
        run: node scripts/verify_entrust_ui.js

      - name: 路由注册表校验（页面栈预算 / 深链参数契约）
        # verify_miniapp 已覆盖「可达性」与「tabBar 该用 switchTab」；本步补的是
        # 注册表 ⇄ app.json 双向一致、声明链深 ≤ STACK_BUDGET、导航边契约（ENT-018：
        # 代码里的每条边都必须在 NAV_EDGES 声明过；push/replace 边无代码证据必须标 pending）。
        # 新增页面不在 miniapp/utils/routes.js 登记 → 本步红。
        # ENT-019 起还核对 `MIGRATED_PAGES`：名单内的页面不得再出现裸
        # wx.navigateTo / redirectTo / switchTab / reLaunch，必须经 go()。
        run: node scripts/verify_routes.js

      - name: 路由模块行为测试（参数契约 / 复用键 / 策略链 / 环）
        # verify_routes 只能证明「声明与代码一致」，证明不了「声明本身是对的」。
        # HO 实测的 4 个问题（空参通过、非法枚举通过、双向来路算成 Infinity、缺参仍
        # navigateTo）全是**语义**问题，它们能在静态门禁全绿时存在，所以必须有这一层。
        run: node scripts/verify_routes_behavior.js

      - name: tabBar 目标行为校验（动态 switchTab 取值域）
        # verify_routes 只能解析**字面量**目标；目标由变量算出的调用点
        # （ROLE_META[role].page / map[role] / conf[role] || conf.all）它只记一条
        # 「[变量目标]」备注就放行。此处驱动真实页面与自定义 tabBar 逻辑，把捕获到的
        # 目标与 app.json 的 tabBar.list 比对 —— switchTab 打到非 tabBar 页是
        # **静默失败**（用户只看到"点了没反应"），静态门禁全绿也照样发生。
        # verify_routes 的「[变量目标]」备注**保留**：它是对所有动态调用的中立记录，
        # 不是判错；本步只钉住能算出取值域的那几处。
        run: node scripts/verify_tabbar_targets.js

      - name: 小程序 require 相对路径校验
        # 2026-09-13 真机走查发现：三层目录的页面把 utils 写成 '../../utils/entrust'，
        # 解析成不存在的 pages/utils/entrust.js → 页面在**真机白屏**，而静态门禁全绿
        # （verify_*_ui 只读源码文本做断言、verify_frontend_e2e 用 requireStub 替换依赖，
        #   两者都不做真实路径解析）。本步补上「解析出的目标文件必须真实存在」这一维。
        run: node scripts/verify_require_paths.js

  # ─────────────────────────────────────────────────────────────
  # 前端端到端：真起后端 → 铺演示数据 → 真载荷驱动页面逻辑
  #   verify_login_flow     登录链路顺序 / 鉴权头 / token 角色
  #   verify_frontend_e2e   15 个页面的取数与装饰逻辑（含模板字段产出、派生数值边界）
  #                         第 ⑬⑭ 段为「委托队列 · 经理工作台」与「委托详情」，跑的是真载荷
  # 说明：后端与校验放在同一个 shell —— 跨 step 的后台进程会被 runner 回收。
  # ─────────────────────────────────────────────────────────────
  frontend-e2e:
    name: 前端端到端（真后端载荷驱动）
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装后端依赖
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 应用数据库迁移
        # 委托支线的表统一 `ent_` 前缀、由 `backend/migrations/` 管理，
        # `app/main.py` 的 create_all **明确排除**该前缀（决策 DR-0001）。
        # 少了这一步，起后端后 `/api/v1/entrust/*` 会整组 500
        #   （sqlite3.OperationalError: no such table: ent_assignment），
        # 而 e2e 的取数助手会把 500 记成"委托没数据"——看起来像业务问题。
        # 与 `db-migration` job 同一命令、同一 CWD（DATABASE_URL 是相对路径）。
        working-directory: backend
        run: python migrate.py

      - name: 起后端 → 铺演示数据 → 跑端到端校验
        env:
          APP_ENV: development
          # 委托支线默认关闭（`.env.development` 里没有这一项，config 默认 False）。
          # 这里**显式**打开而不是去改配置文件：本 job 要验的正是委托页面，
          # 把结论挂在"某个文件的默认值"上，那个值一改就会静默少验一半断言。
          ENTRUST_ENABLED: "true"
        run: |
          set -e
          cd backend
          # .env.development 已入库（WECHAT_MOCK=true + LLM_MOCK=true），无需任何 Key 或外部服务
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn.log 2>&1 &
          UVPID=$!
          trap 'kill $UVPID 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 2 http://127.0.0.1:8000/healthz || true)
            if [ "$code" = "200" ]; then echo "✓ 后端就绪（第 ${i} 次探活）"; break; fi
            if [ "$i" = "30" ]; then
              echo "✗ 后端 30s 内未就绪，日志尾部："
              tail -40 /tmp/uvicorn.log || true
              exit 1
            fi
            sleep 1
          done

          python scripts/seed_demo.py
          python scripts/seed_entrust_demo.py
          cd ..
          node scripts/verify_login_flow.js
          node scripts/verify_frontend_e2e.js
