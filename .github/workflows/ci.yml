name: CI

on:
  push:
    branches: [develop, main, "feature/**", "release/**", "hotfix/**"]
  pull_request:
    branches: [develop, main]

jobs:
  # ─────────────────────────────────────────────────────────────
  # 后端：lint + 类型检查 + 单测
  # ─────────────────────────────────────────────────────────────
  backend:
    name: 后端 lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint（ruff check）
        run: ruff check app tests

      - name: 格式门禁（ruff format --check，阻塞）
        # ruff 版本已精确锁定在 requirements.txt（DR-0004），保证 CI 与本地结果一致。
        # 升级 ruff 必须走独立 PR：改版本号 + 全量重跑格式化（单独 style 提交）。
        run: ruff format --check app tests

      - name: 类型检查（mypy，阻塞——my 闭环后 0 errors）
        run: mypy app migrations migrate.py

      - name: 测试（pytest）
        env:
          APP_ENV: test
        run: pytest --tb=short --cov=app --cov-report=term-missing

  # ─────────────────────────────────────────────────────────────
  # 数据库迁移：全新 SQLite 库上跑通迁移，并证明重复执行是幂等的
  #   MySQL 方言由下方 db-migration-mysql job 真实执行（DR-0002）。
  # ─────────────────────────────────────────────────────────────
  db-migration:
    name: 数据库迁移（SQLite 冒烟 + 幂等）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:///./migration_smoke.db
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 迁移状态（全新库，应全部待执行）
        run: python migrate.py --status

      - name: 执行迁移并校验（首次）
        run: python migrate.py --verify

      - name: 再次执行应无待执行（幂等）
        run: python migrate.py --verify

  # ─────────────────────────────────────────────────────────────
  # 数据库迁移（MySQL 真实执行，DR-0002）：
  #   证明迁移的 mysql 方言 SQL 在真实 MySQL 8.0 上可执行且幂等。
  #   范围界定：仅覆盖迁移 SQL；pytest 对接 MySQL 的并发集成测试
  #   属后续增量（见 DR-0002「范围界定」）。
  # ─────────────────────────────────────────────────────────────
  db-migration-mysql:
    name: 数据库迁移（MySQL 8.0 真实执行）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: entrust_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: test
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/entrust_test?charset=utf8mb4
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # pymysql 仅 CI 用（纯 Python，无编译依赖）；生产驱动选型不在 DR-0002 范围
          pip install pymysql

      - name: 等待 MySQL 就绪
        run: |
          for i in $(seq 1 30); do
            if python -c "import os; from sqlalchemy import create_engine, text; e = create_engine(os.environ['DATABASE_URL']); c = e.connect(); c.execute(text('SELECT 1')); c.close(); print('mysql ready')" 2>/dev/null; then exit 0; fi
            echo "waiting mysql ($i/30)"; sleep 2
          done
          echo "MySQL 60s 内未就绪"; exit 1

      - name: 迁移状态（全新库，应全部待执行）
        run: python migrate.py --status

      - name: 执行迁移并校验（首次，MySQL 方言）
        run: python migrate.py --verify

      - name: 再次执行应无待执行（幂等）
        run: python migrate.py --verify

  # ─────────────────────────────────────────────────────────────
  # 前端静态契约：不依赖后端，秒级完成
  #   verify_miniapp       JSON 语法 / 页面四件套 / tabBar / 路由可达 / 事件函数存在性
  #   verify_ui_interactions 组件 props 与事件 / 弹层闭环 / 长列表与日期等静态防线
  # 真机走查（verify_miniapp_device）依赖微信开发者工具，无法在 CI 运行，仍由本机执行。
  # ─────────────────────────────────────────────────────────────
  frontend-static:
    name: 前端静态契约（结构 / 路由 / UI 交互）
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 小程序结构 / 路由 / 事件校验
        run: node scripts/verify_miniapp.js

      - name: UI 交互契约校验
        run: node scripts/verify_ui_interactions.js

  # ─────────────────────────────────────────────────────────────
  # 前端端到端：真起后端 → 铺演示数据 → 真载荷驱动页面逻辑
  #   verify_login_flow     登录链路顺序 / 鉴权头 / token 角色
  #   verify_frontend_e2e   13 个页面的取数与装饰逻辑（含模板字段产出、派生数值边界）
  # 说明：后端与校验放在同一个 shell —— 跨 step 的后台进程会被 runner 回收。
  # ─────────────────────────────────────────────────────────────
  frontend-e2e:
    name: 前端端到端（真后端载荷驱动）
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装后端依赖
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 起后端 → 铺演示数据 → 跑端到端校验
        env:
          APP_ENV: development
        run: |
          set -e
          cd backend
          # .env.development 已入库（WECHAT_MOCK=true + LLM_MOCK=true），无需任何 Key 或外部服务
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn.log 2>&1 &
          UVPID=$!
          trap 'kill $UVPID 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 2 http://127.0.0.1:8000/healthz || true)
            if [ "$code" = "200" ]; then echo "✓ 后端就绪（第 ${i} 次探活）"; break; fi
            if [ "$i" = "30" ]; then
              echo "✗ 后端 30s 内未就绪，日志尾部："
              tail -40 /tmp/uvicorn.log || true
              exit 1
            fi
            sleep 1
          done

          python scripts/seed_demo.py
          cd ..
          node scripts/verify_login_flow.js
          node scripts/verify_frontend_e2e.js
